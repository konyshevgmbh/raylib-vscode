<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>raylib button</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas.emscripten { display: block; margin: 0 auto; border: 0; background: #000; }
      #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                color: #ccc; font: 16px sans-serif; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">Loading...</div>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); },
        // hide the status text once the first frame is running
        postRun: [function () { document.getElementById('status').style.display = 'none'; }]
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
